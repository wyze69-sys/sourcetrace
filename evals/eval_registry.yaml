schema_version: 1
purpose: >-
  Canonical registry for reproducible SourceTrace RAG evaluations. Evaluation
  cases and scorecards are added during EVAL-001 after real retrieval/chat behavior exists.

artifact_policy:
  datasets: versioned synthetic or deliberately public evaluation questions
  fixtures: synthetic or deliberately public repositories only
  tests: deterministic evaluation runners and assertions
  scorecards: reviewed baseline and comparison summaries
  traces: generated locally; ignored by Git
  results: generated locally; ignored by Git

required_metric_families:
  - expected_source_recall_at_k
  - citation_validity
  - groundedness
  - insufficient_evidence_accuracy
  - indexing_latency
  - query_latency
  - provider_cost_when_available
  - trace_step_edge_gap_accuracy
  - impact_upstream_downstream_accuracy
  - risk_factor_accuracy
  - determinism_verification

evaluation_suites:
  - id: rag-v1
    dataset: dataset.v1.json
    runner: run_eval.py
    tests: tests/test_eval_runner.py
    covers: retrieval, grounded chat, citations, insufficient evidence
  - id: trace-impact-v1
    dataset: trace_impact.dataset.v1.json
    runner: run_trace_impact_eval.py
    tests: tests/test_trace_impact_eval.py
    covers: >-
      static flow trace (steps, edges, confidence, gaps), change impact preview
      (upstream/downstream, risk factors), citation validity against fixture
      lines, storage-order determinism
