name: SourceTrace CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Lint, Tests, and API Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --extra dev

      - name: Verify lockfile
        run: |
          cd backend
          uv lock --check

      - name: Run Ruff linter
        run: |
          cd backend
          uv run ruff check .

      - name: Run backend pytest suite
        run: |
          cd backend
          uv run pytest

      - name: Verify tracked OpenAPI 3.1 runtime API contracts
        run: |
          cd backend
          uv run pytest tests/api/test_runtime_openapi.py

  frontend-ci:
    name: Frontend Lint, Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest unit tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build

  evaluations-ci:
    name: Offline Reproducible RAG Evaluation Suite
    runs-on: ubuntu-latest
    needs: [backend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies for evaluation runner
        run: |
          cd backend
          uv sync --extra dev

      - name: Run offline RAG evaluation runner
        run: |
          cd backend
          uv run python ../evals/run_eval.py
