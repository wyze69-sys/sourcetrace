schema_version: 1
project: SourceTrace
purpose: >-
  Canonical capability registry used to prevent duplicate implementation. Before
  coding, agents confirm the capability ID, lifecycle status, owning task, and one
  canonical implementation path per layer. Update this file after every verified
  feature addition, extension, replacement, deprecation, removal, or ownership move.

lifecycle_values:
  - planned
  - prototype_present_unverified
  - in_progress
  - implemented_verified
  - deprecated
  - removed
  - deferred

rules:
  - A capability has one stable ID for its lifetime.
  - One layer has at most one canonical owner path for a capability.
  - Existing prototype paths are not approved merely because files exist.
  - Replacement work removes or deprecates superseded paths in the same coherent task.
  - A completed task is never restarted; fixes/extensions get a new task ID referencing this capability.
  - Status becomes implemented_verified only after acceptance criteria and fresh verification pass.
  - Code and git diff are reality; reconcile this registry before new work if they disagree.

