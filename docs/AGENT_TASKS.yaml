schema_version: 1
project: SourceTrace
purpose: >-
  Machine-readable execution queue for AI coding agents. Agents select only tasks
  whose status is ready and whose dependencies are completed. The coordinator is
  the only actor allowed to change task status.

source_of_truth:
  - /AGENTS.md
  - /docs/PROJECT_STATE.md
  - /docs/AGENT_TASKS.yaml
  - /docs/CODEBASE_MAP.md
  - /docs/FEATURE_REGISTRY.yaml
  - /docs/LAST_HANDOFF.md
  - /docs/ARCHITECTURE.md
  - /docs/ROADMAP.md
  - /frontend/AGENTS.md
  - /backend/AGENTS.md

current_stage: architecture_scaffold
implementation_started: true

approved_mvp_decisions:
  identity: anonymous browser session only; user accounts and OAuth are deferred
  session_transport: signed HttpOnly Secure SameSite=Lax cookie
  session_retention_days: 7
  repository_limit_per_session: 3
  source_inputs:
    - public GitHub repository URL
    - ZIP upload
  source_retention: >-
    Temporary downloaded/extracted source is deleted immediately after indexing
    succeeds or fails. MongoDB chunks and conversations expire 7 days after the
    session's last activity or are removed earlier when the user deletes a repository.
  zip_limits:
    maximum_compressed_mb: 25
    maximum_extracted_mb: 100
    maximum_files: 5000
    maximum_single_file_mb: 1
    maximum_compression_ratio: 20
  github_limits:
    allowed_host: github.com
    maximum_download_mb: 25
    request_timeout_seconds: 120
  parser_mvp: Python only
  refresh_strategy: full repository re-index; incremental refresh is deferred
  indexing_progress: HTTP polling; WebSockets and SSE are deferred

agent_startup:
  - Read /AGENTS.md.
  - Read /docs/PROJECT_STATE.md.
  - Read this task queue.
  - Read /docs/CODEBASE_MAP.md.
  - Read /docs/FEATURE_REGISTRY.yaml and run the duplicate/loop preflight from /AGENTS.md.
  - Read /docs/LAST_HANDOFF.md when continuing existing work.
  - Run git status and preserve all existing changes.
  - Select one ready task with completed dependencies.
  - Read only the architecture and area-specific documents needed for that task.
  - Inspect existing files before editing.
  - Implement only the assigned scope.
  - Run required verification and produce the handoff format from /AGENTS.md.
  - Synchronize PROJECT_STATE.md, LAST_HANDOFF.md, and any affected contracts before finishing.

stop_and_ask_when:
  - No task is marked ready.
  - A required product decision is unresolved.
  - The requested change conflicts with canonical architecture.
  - Required credentials or external resources are unavailable.
  - Existing uncommitted changes overlap the assigned files.
  - The task would require executing an indexed repository.

statuses:
  allowed:
    - blocked
    - ready
    - in_progress
    - review
    - completed
  rule: Only the coordinator updates status or dependencies.

always_allowed_sync_paths:
  - docs/PROJECT_STATE.md
  - docs/CODEBASE_MAP.md
  - docs/FEATURE_REGISTRY.yaml
  - docs/LAST_HANDOFF.md
  - docs/AGENT_TASKS.yaml
  - docs/api/**
  - docs/database/**
  - docs/decisions/**
  - README.md
  - .gitignore

anti_loop_and_duplicate_rules:
  - Every capability has one feature-registry ID and one owning implementation path per layer.
  - A completed task is immutable; fixes/extensions use a new unique task ID referencing the original.
  - The coordinator records completion evidence and implementation paths before unblocking dependents.
  - No two ready/in_progress/review tasks may own the same feature, route, collection, or file boundary.
  - Replacement tasks remove or deprecate the superseded implementation and test the canonical path.
  - Follow-up tasks require a concrete unresolved defect, risk, or unmet acceptance criterion.
  - Manual or user edits are reconciled from git diff into state, map, registry, and handoff before new implementation.

tasks:
  - id: ARCH-001
    title: Record the approved MVP identity and repository ownership model
    phase: 0
    status: completed
    dependencies: []
    owner: agent
    allowed_paths:
      - docs/decisions/**
      - docs/ARCHITECTURE.md
      - docs/AGENT_TASKS.yaml
    forbidden_paths:
      - frontend/**
      - backend/src/**
    objective: >-
      Record the approved anonymous-session model from approved_mvp_decisions and
      define authorization scope for repositories, chunks, jobs, and chats. Do not
      redesign identity or add account login/OAuth.
    acceptance_criteria:
      - A decision record states anonymous signed-cookie sessions and explains why accounts/OAuth are deferred.
      - Every persistent resource is scoped by the anonymous session identifier.
      - Expiration and deletion behavior matches approved_mvp_decisions exactly.
      - ARCH-002 is unblocked by the decision.
    verification:
      - Confirm documentation has no conflicting ownership rules.
      - Run git diff --check.

  - id: ARCH-001-FIX-001
    title: Correct ARCH-001 session ownership model and retention scope
    phase: 0
    status: completed
    dependencies:
      - ARCH-001
    owner: agent
    allowed_paths:
      - docs/decisions/**
      - docs/ARCHITECTURE.md
      - docs/AGENT_TASKS.yaml
    forbidden_paths:
      - frontend/**
      - backend/src/**
    objective: >-
      Correct cookie deployment invariants, deterministic 404 authorization behavior,
      owner_session_id consistency, and remove premature implementation details / TTL
      cascade claims from ARCH-001.
    acceptance_criteria:
      - ADR 0001 documents relative /api proxying and API-triggered session creation.
      - Non-owned or missing resources return 404 Not Found deterministically.
      - owner_session_id is used consistently in architecture examples and decision records.
      - Premature commitments (anon_ prefix, HMAC-SHA256, automatic TTL cascades) are removed.
      - Exact cleanup mechanism and retention scope are deferred to ARCH-002.
    verification:
      - Run YAML validation and consistency searches.
      - Run git diff --check.

  - id: ARCH-002
    title: Record approved source retention, quotas, and ingestion limits
    phase: 0
    status: completed
    dependencies:
      - ARCH-001
      - ARCH-001-FIX-001
    owner: agent
    allowed_paths:
      - docs/decisions/**
      - docs/ARCHITECTURE.md
      - docs/AGENT_TASKS.yaml
    objective: >-
      Record the exact retention, repository quota, ZIP limits, and GitHub limits
      in approved_mvp_decisions. Do not substitute different numbers without an
      explicit coordinator decision.
    acceptance_criteria:
      - Limits are explicit numbers, not placeholders.
      - Temporary and persisted source retention are distinguished.
      - User deletion behavior is defined.
      - Security tests required by the decision are listed.
    verification:
      - Review against the security boundaries in /AGENTS.md.
      - Run git diff --check.

  - id: ARCH-003
    title: Freeze MVP API and MongoDB resource contracts
    phase: 0
    status: completed
    dependencies:
      - ARCH-001
      - ARCH-002
    owner: agent
    allowed_paths:
      - docs/api/**
      - docs/database/**
      - docs/decisions/**
      - docs/ARCHITECTURE.md
      - docs/AGENT_TASKS.yaml
    objective: >-
      Define versioned repository, indexing-job, chat, citation, evidence, and error
      contracts plus MongoDB collection ownership and vector-filter fields.
    acceptance_criteria:
      - HTTP methods, paths, request bodies, responses, and error shapes are documented.
      - Repository and owner/session filters are mandatory in vector queries.
      - Indexing state transitions and retry behavior are defined.
      - Frontend and backend foundation tasks can proceed without inventing types.
    verification:
      - Cross-check HTTP and MongoDB identifiers for consistency.
      - Run git diff --check.

  - id: BE-001
    title: Migrate prototype to the approved FastAPI and MongoDB foundation
    phase: 1
    status: completed
    dependencies:
      - ARCH-003
    owner: agent
    allowed_paths:
      - backend/**
      - docs/api/**
      - docs/database/**
      - docs/AGENT_TASKS.yaml
    objective: >-
      Establish FastAPI v1 health/config/error/storage foundations, remove obsolete
      Streamlit/Chroma assumptions, and add offline tests with mocked storage.
    acceptance_criteria:
      - FastAPI app exposes the approved health contract.
      - MongoDB lifecycle and repository interfaces are typed and mockable.
      - Default tests require no live database or paid API.
      - Obsolete dependencies are removed intentionally with lockfile updated.
    verification:
      - Run uv sync --extra dev from backend/.
      - Run uv run ruff check . from backend/.
      - Run uv run pytest from backend/.
      - Run git diff --check from repository root.

  - id: FE-001
    title: Initialize the React TypeScript application foundation
    phase: 2
    status: completed
    dependencies:
      - ARCH-003
    owner: agent
    allowed_paths:
      - frontend/**
      - docs/api/**
      - docs/AGENT_TASKS.yaml
    objective: >-
      Initialize Vite React TypeScript in the existing frontend root and implement
      routing, API client, quality tooling, and honest repository/chat shell states.
    acceptance_criteria:
      - One React TypeScript app exists under frontend/ with no duplicate root.
      - API types match the frozen API contract.
      - Loading, empty, error, and indexing states are represented without fake data.
      - No database or LLM credentials are present in browser code.
    verification:
      - Run the configured frontend lint command.
      - Run the configured frontend tests.
      - Run the configured frontend production build.
      - Inspect browser console and network behavior for affected routes.
      - Run git diff --check from repository root.

  - id: BE-002
    title: Implement concrete MongoDB session, repository, and job persistence
    phase: 3
    status: completed
    dependencies:
      - BE-001
      - ARCH-003
    owner: agent
    allowed_paths:
      - backend/src/sourcetrace/storage/**
      - backend/tests/storage/**
      - backend/src/sourcetrace/core/**
      - backend/src/sourcetrace/api/**
      - backend/src/sourcetrace/workers/**
      - backend/tests/core/**
      - backend/tests/api/**
      - backend/tests/workers/**
      - docs/AGENT_TASKS.yaml
      - docs/PROJECT_STATE.md
      - docs/LAST_HANDOFF.md
      - docs/FEATURE_REGISTRY.yaml
      - docs/CODEBASE_MAP.md
    objective: >-
      Implement concrete MongoDB session, repository, and job persistence in 3 parts:
      Part 1: concrete PyMongo repositories with strict type validation and ownership filtering.
      Part 2: signed anonymous-session cookie runtime, security handler, and FastAPI dependency injection.
      Part 3: session retention cleanup and background sweeper worker.
    acceptance_criteria:
      - Concrete PyMongo classes implement AnonymousSessionRepository, RepositoryRecord, and IndexingJobRecord protocols.
      - Every database lookup, update, list, count, and deletion operation filters by owner_session_id.
      - Repository operations filter by owner_session_id and repository_id.
      - Job operations filter by owner_session_id and job_id (or repository_id).
      - Raw _id is never exposed or mapped into domain records.
      - Datetimes remain timezone-aware UTC.
      - Malformed database documents strictly fail as StorageDataError without leaking values/IDs.
      - Saves use replace_one with upsert=True.
      - SessionRetentionSweeper claims expired sessions atomically and deletes child resources before parent session.
      - Tests are offline and require no live MongoDB.
    verification:
      - Run uv run ruff check . from backend/.
      - Run uv run pytest tests/workers tests/storage tests/core tests/api from backend/.
      - Run uv run pytest from backend/.
      - Run git diff --check.

  - id: INGEST-001
    title: Implement safe public GitHub and ZIP acquisition
    phase: 3
    status: completed
    dependencies:
      - BE-001
      - ARCH-002
      - BE-002
    owner: agent
    allowed_paths:
      - backend/src/sourcetrace/api/**
      - backend/src/sourcetrace/core/**
      - backend/src/sourcetrace/ingestion/**
      - backend/src/sourcetrace/models/**
      - backend/src/sourcetrace/storage/**
      - backend/tests/storage/**
      - backend/tests/ingestion/**
      - backend/tests/**
      - docs/AGENT_TASKS.yaml
    objective: >-
      Safely acquire public GitHub archives and ZIP uploads without executing code,
      then create observable indexing jobs.
    acceptance_criteria:
      - URL, redirect, timeout, size, traversal, symlink, compression, and file-count controls are tested.
      - Secrets and unsupported paths are excluded.
      - Temporary files follow the approved retention decision.
      - Repository code is never executed.
    verification:
      - Run backend lint and full tests.
      - Run focused adversarial ingestion tests.
      - Run git diff --check.

  - id: INDEX-001
    title: Implement Python parsing, embeddings, and Atlas vector storage
    phase: 4
    status: completed
    dependencies:
      - INGEST-001

    owner: agent
    allowed_paths:
      - backend/src/sourcetrace/ingestion/**
      - backend/src/sourcetrace/parsers/**
      - backend/src/sourcetrace/storage/**
      - backend/src/sourcetrace/models/**
      - backend/tests/**
      - docs/database/**
      - docs/AGENT_TASKS.yaml
    objective: >-
      Produce deterministic Python symbol chunks with exact citations, embed them
      through a provider interface, and store repository-scoped vectors in Atlas.
    acceptance_criteria:
      - Parser fixtures prove exact relative paths and line ranges.
      - Chunk metadata includes hashes, parser version, and embedding model/version.
      - Vector queries cannot cross repository or owner/session boundaries.
      - Provider and database calls are mockable in default tests.
    verification:
      - Run backend lint and full tests.
      - Run parser and storage integration tests.
      - Run git diff --check.

  - id: PIPE-001
    title: Integrate write endpoints with the acquired-source indexing pipeline
    phase: 4
    status: completed
    dependencies:
      - INGEST-001
      - INDEX-001
      - BE-002
    owner: agent
    allowed_paths:
      - backend/src/sourcetrace/api/**
      - backend/src/sourcetrace/ingestion/**
      - backend/tests/**
      - docs/AGENT_TASKS.yaml
    objective: >-
      Integrate POST /api/v1/repositories and POST /api/v1/repositories/upload
      write endpoints with the acquired-source indexing pipeline, multipart staging,
      background execution, and production consumer wiring.
    acceptance_criteria:
      - POST /repositories and POST /repositories/upload endpoints accept valid requests.
      - Streamed multipart staging handles file uploads safely.
      - Indexing job transitions through acquiring, scanning, parsing, embedding, storing, and ready/failed.
      - End-to-end repository indexing succeeds cleanly.
    verification:
      - Run backend lint and full tests.
      - Run API write route integration tests.
      - Run git diff --check.


  - id: RAG-001
    title: Implement evidence-grounded repository chat
    phase: 5
    status: completed
    dependencies:
      - INDEX-001
      - FE-001
    owner: agent
    allowed_paths:
      - backend/src/sourcetrace/api/**
      - backend/src/sourcetrace/retrieval/**
      - backend/src/sourcetrace/generation/**
      - backend/prompts/**
      - backend/src/sourcetrace/models/**
      - backend/tests/**
      - frontend/src/**
      - frontend/tests/**
      - docs/AGENT_TASKS.yaml
    objective: >-
      Retrieve repository-scoped evidence, generate answers that cite only retrieved
      chunks, return insufficient evidence honestly, and connect the real chat UI.
    acceptance_criteria:
      - Answers cite only returned evidence chunks.
      - Insufficient evidence is explicit and tested.
      - Cross-repository authorization tests pass.
      - Frontend opens citations and renders evidence safely.
    verification:
      - Run backend lint and full tests.
      - Run frontend lint, tests, and build.
      - Perform browser network/console verification.
      - Run git diff --check.

  - id: EVAL-001
    title: Add reproducible RAG evaluation and deployment polish
    phase: 6
    status: completed
    dependencies:
      - RAG-001
    owner: agent
    allowed_paths:
      - backend/**
      - frontend/**
      - evals/**
      - docs/**
      - .github/**
    objective: >-
      Demonstrate measurable retrieval and grounding quality, establish CI, and
      document a reproducible hosted portfolio deployment.
    acceptance_criteria:
      - Versioned questions map to expected files, symbols, or citation ranges.
      - Retrieval, citation, grounding, latency, and cost metrics are reported.
      - CI runs frontend and backend checks.
      - Deployment and limitations are documented without fabricated URLs/results.
    verification:
      - Run all frontend/backend checks and evaluation commands.
      - Verify hosted endpoints only when real deployment handles exist.
      - Run git diff --check.

  - id: NOTOKEN-001
    title: Phase 1 Free Static Inspection Mode Architecture & Implementation
    phase: 5
    status: completed
    dependencies:
      - EVAL-001
    owner: agent
    allowed_paths:
      - backend/**
      - frontend/**
      - docs/**
    objective: >-
      Implement zero-token free static inspection mode allowing public GitHub repository
      indexing and citation retrieval without requiring paid Gemini/OpenAI API keys.
    acceptance_criteria:
      - NoOpEmbeddingAdapter allows repository indexing to reach ready state with zero API keys.
      - SOURCETRACE_INSPECTION_MODE setting supports static mode.
      - CodeChunkRepository.search_lexical() returns verified line citations for symbol/path queries.
      - Offline unit and integration tests pass 100%.
    verification:
      - Run uv run pytest -q.
      - Run npm test -- --run.
      - Run git diff --check.

  - id: NOTOKEN-001-CORRECTION
    title: Phase 1 True Zero-Token Static Inspection Mode Correction
    phase: 5
    status: completed
    dependencies:
      - NOTOKEN-001
    owner: agent
    allowed_paths:
      - backend/**
      - frontend/**
      - docs/**
    objective: >-
      Correct Phase 1 static mode by removing fake zero-dimension adapters, omitting vector fields from MongoDB for static chunks, bypassing embedding_started() and embed_chunks(), persisting repository index_mode, deriving search terms at storage time, adding POST /search and GET /capabilities API endpoints, and displaying static Evidence UI.
    acceptance_criteria:
      - Fake NoOpEmbeddingAdapter deleted.
      - Static chunks store None for embedding fields and omit vector field in MongoDB.
      - Indexing in static mode bypasses embedding stage completely (queued -> acquiring -> scanning -> parsing -> storing -> ready).
      - RepositoryRecord persists index_mode ("static" default).
      - POST /api/v1/repositories/{id}/search returns static evidence citations.
      - Frontend renders Evidence Search UI with static banner.
      - Full test suites pass with 0 external AI API calls.
    verification:
      - Run uv run pytest -q.
      - Run npm test -- --run.
  - id: NOTOKEN-001-FINAL-2
    title: Remove silent index fallback and close Phase 1
    phase: 5
    status: completed
    dependencies:
      - NOTOKEN-001-CORRECTION
    owner: agent
    allowed_paths:
      - backend/**
      - frontend/**
      - docs/**
    objective: >-
      Remove silent index-creation exception fallback in MongoCodeChunkRepository._ensure_indexes_lazily(), implement process/database thread-safe index caching, centralize capability/provider readiness evaluation across routes, and verify live MongoDB IXSCAN query plan.
    acceptance_criteria:
      - _ensure_indexes_lazily() propagates StorageOperationError when index creation fails.
      - Save/search operations abort immediately if index creation fails (0 COLLSCAN fallback).
      - MongoStorageManager caches index initialization state thread-safely per process/database.
      - evaluate_capabilities() centralizes provider/key readiness for GET /capabilities and POST /repositories.
      - Settings is injected into repository routes via Depends(get_settings).
      - Live FitSync verification on port 8000 shows IXSCAN winning query plan and HTTP 200 responses.
      - Full unit test suites pass (1,047 backend passed, 17 frontend passed).
    verification:
      - Run uv run pytest -q.
      - Run npm test -- --run.
      - Run npm run build.
      - Run uv run python tests/inspect_live_results.py.
      - Run git diff --check.

